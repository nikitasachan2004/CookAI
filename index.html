<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EE" />
    <meta name="description" content="COOKAI — Cook smarter with what you already have. Enter your ingredients, match real recipes instantly." />
    <meta property="og:title" content="COOKAI — Cook with what you have" />
    <meta property="og:description" content="Stop searching, start cooking. COOKAI matches recipes to your exact ingredients and kitchen tools." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <title>COOKAI — Cook with what you have</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="nav-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="1" seed="1" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="40" xChannelSelector="R" yChannelSelector="B" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="2"/>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
